# SARCONX — 301 redirects for pages removed/renamed in the redesign
# Loaded at Apache server-config level (conf-enabled/), so it works without
# depending on AllowOverride / .htaccess. mod_alias (Redirect) is enabled by default.
# Google will honour these 301s and drop the old URLs from its index.

# --- old AI-agent / service pages  ->  consolidated services page ---
Redirect 301 /agent-amministrativo.html  /servizi.html
Redirect 301 /agent-analytics.html       /servizi.html
Redirect 301 /agent-commerciale.html     /servizi.html
Redirect 301 /agent-manutenzione.html    /servizi.html
Redirect 301 /agent-operativita.html     /servizi.html
Redirect 301 /agent-qualita.html         /servizi.html
Redirect 301 /agentizzazione.html        /servizi.html
Redirect 301 /automazione-ai.html        /servizi.html
Redirect 301 /software-dedicati.html     /servizi.html
Redirect 301 /gestionali.html            /servizi.html
Redirect 301 /app-web-app.html           /servizi.html
Redirect 301 /siti-web.html              /servizi.html

# --- renamed / removed portfolio & case pages -> lavori ---
Redirect 301 /portfolio.html             /lavori.html
Redirect 301 /case-mail-scraper.html     /lavori.html

# --- on-brand 404 catch-all (keeps 404 status code for SEO) ---
ErrorDocument 404 /404.html
