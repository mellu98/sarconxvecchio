# SARCONX — 301 redirects for pages removed/renamed in the redesign
# Loaded at Apache server-config level (conf-enabled/), works without AllowOverride.
# Targets are ABSOLUTE https URLs because Coolify/Traefik terminates TLS in front of
# Apache: a path-only Redirect would be rewritten to http:// (Apache sees the backend
# as http), causing a "Not secure" flash + an extra 307 hop. Absolute https skips that.

# --- old AI-agent / service pages  ->  consolidated services page ---
Redirect 301 /agent-amministrativo.html  https://sarconx.com/servizi.html
Redirect 301 /agent-analytics.html       https://sarconx.com/servizi.html
Redirect 301 /agent-commerciale.html     https://sarconx.com/servizi.html
Redirect 301 /agent-manutenzione.html    https://sarconx.com/servizi.html
Redirect 301 /agent-operativita.html     https://sarconx.com/servizi.html
Redirect 301 /agent-qualita.html         https://sarconx.com/servizi.html
Redirect 301 /agentizzazione.html        https://sarconx.com/servizi.html
Redirect 301 /automazione-ai.html        https://sarconx.com/servizi.html
Redirect 301 /software-dedicati.html     https://sarconx.com/servizi.html
Redirect 301 /gestionali.html            https://sarconx.com/servizi.html
Redirect 301 /app-web-app.html           https://sarconx.com/servizi.html
Redirect 301 /siti-web.html              https://sarconx.com/servizi.html

# --- renamed / removed portfolio & case pages -> lavori ---
Redirect 301 /portfolio.html             https://sarconx.com/lavori.html
Redirect 301 /case-mail-scraper.html     https://sarconx.com/lavori.html

# --- on-brand 404 catch-all (keeps 404 status code for SEO) ---
ErrorDocument 404 /404.html
